<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estado del pedido · QuickDish</title><link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body class="pale">
<div id="nav"></div><div class="wrap"><h1 style="text-align:center">ESTADO DEL PEDIDO</h1><div class="ec" id="c"></div></div>
<script src="js/app.js"></script>
<script>
nav('Pedidos');const P=[['✔','Pedido recibido'],['👨‍🍳','En preparación'],['🔔','Listo para recoger'],['✔','Pedido completado']];
function draw(){const o=ls.get(key('order'),null);
if(!o){$('#c').innerHTML='No tienes pedidos activos. <a href="restaurantes.html"><b>Hacer un pedido</b></a>';return}
$('#c').innerHTML=`<p>ORDEN #${o.n}</p><p style="margin:8px 0">${o.r}</p><p style="font-size:16px">${o.items}</p>
<div class="st">${P.map((p,i)=>`<div class="${i<=o.paso?'d':''} ${i==2&&i<=o.paso?'c':''}"><i>${p[0]}</i><span>${p[1]}</span></div>`).join('')}</div>
<button class="btn" style="margin-top:24px;background:#0096b4;color:#111" ${o.paso>=3?'disabled':''} onclick="sig()">${o.paso>=3?'Pedido completado':'Marcar como listo'}</button>`}
function sig(){const o=ls.get(key('order'));o.paso=Math.min(o.paso+1,3);ls.set(key('order'),o);draw()}
draw()
</script></body></html>
