<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · QuickDish</title><link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body class="pg" data-public>
<main class="split">
<div class="lft"><a class="logo" href="index.html"><i></i>QuickDish</a><div class="phone"><div>🍔</div></div></div>
<form class="card" id="f"><h1>¡Hola!<br>¡Bienvenido!</h1><h2>Accedamos a tu cuenta</h2>
<div class="err" id="e"></div><div class="ok" id="ok"></div>
<label class="lab">Email o celular</label><input class="in" id="u" required>
<label class="lab">Contraseña</label><input class="in" id="p" type="password" required>
<button class="btn">Iniciar Sesión</button>
<p class="lk">¿No tiene cuenta? <a href="registro.html">REGISTRARSE</a><br><a href="recuperar.html">Olvide mi contraseña</a><br><a href="registro.html">REGISTRARSE COMO RESTAURANTE</a></p></form></main><div class="foot"><span>▙LJD Codeworks · Powered By</span><span>Política de Privacidad · Cookies</span></div>
<script src="js/app.js"></script>
<script>
if(new URLSearchParams(location.search).get('ok'))msg('ok','Cuenta creada. Ya puedes iniciar sesión.');
if(me())location.replace('home.html');
$('#f').onsubmit=async e=>{e.preventDefault();const k=$('#u').value.trim().toLowerCase(),u=ls.get('qd_users',{})[k];
if(!u||u.h!==await sha($('#p').value))return msg('e','Email/celular o contraseña incorrectos.');
ss.set('qd_user',{email:k,nombre:u.nombre});location.href='home.html'}
</script></body></html>
